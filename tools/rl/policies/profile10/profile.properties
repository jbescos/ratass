# Tier 4 driver with the same observation contract and 96x2 network as profile08.
# Repeat 4 produced better solo lap times than repeat 2 with the current policy.
# PPO checkpoint: mixed-setup run iteration 4, 2026-09-10 (33 inputs, repeat 4).
# Completes all 19 maps over 3/5/10 laps without cards.
# Known validation limit: Agile Chassis stalls on map015 in a five-lap solo test.
RL_HIDDEN_SIZE=96
RL_HIDDEN_LAYERS=2
RL_ACTION_REPEAT=4
RL_DRIVER_BENCHMARK_ACTION_REPEAT=4
RL_DRIVER_TIER=4

# Retain the existing reward weights used by the PPO refinement.
RL_REWARD_PROGRESS=1.0
RL_REWARD_STEP_PENALTY=0.05
RL_REWARD_STEERING_PENALTY=0.005
# Penalize abrupt changes to steering and pedals.
RL_REWARD_STEERING_CHANGE_PENALTY=0.06
RL_REWARD_PEDAL_CHANGE_PENALTY=0.02
RL_REWARD_REVERSE_PENALTY_PER_UNIT=0.5
RL_REWARD_REVERSE_MAX_PENALTY=500.0
RL_REWARD_CAR_PUSH_PENALTY=2.8
RL_REWARD_CAR_PUSH_MAX_STEP_PENALTY=8.0
RL_REWARD_OFF_ROAD_PENALTY=0.5
RL_REWARD_OFF_ROAD_DISTANCE_PENALTY=0.5
RL_REWARD_OFF_ROAD_MAX_PENALTY=500.0
RL_REWARD_DRIFT=0.0

# Existing training horizons and action-based limits, retained for future tuning.
RL_GAMMA=0.9975
RL_GAE_LAMBDA=0.975
RL_TRAIN_LAP_BATCH_SIZE=65536
RL_MAX_ACTION_STEPS=38400
RL_NO_PROGRESS_MAX_ACTION_STEPS=450
RL_STATIONARY_GRACE_ACTION_STEPS=30
RL_REWARD_STATIONARY_PENALTY=0.25
RL_OFF_ROAD_FAILURE_MAX_ACTION_STEPS=90

# Fine-tune conservatively from the current exported profile10 policy.
RL_LR=1e-5
RL_ENTROPY_COEFF=0.0
RL_INITIAL_LOG_STD=-3.0
RL_NUM_EPOCHS=2
RL_CLIP_PARAM=0.10
RL_STAGE_ROUTE_TARGETS=lap_real3
RL_STAGE_ITERATIONS=300
RL_CHECKPOINT_EVERY=10
