# Shared steering-only overtaking policy. Throttle and braking remain with the base driver.
# Stages teach one situation at a time, but every promotion is measured against the complete
# scenario matrix so later stages cannot erase earlier behavior.
RL_OVERTAKING_STAGES=closing,lane_change,straight,single_far,single_medium,single,pack,pack
RL_OVERTAKING_STAGE_NAMES=closing_45,lane_gate_50,straight_55,far_55,medium_60,close_65,pack_70,pack_80
RL_OVERTAKING_STAGE_OPPONENT_SPEED_SCALES=0.45,0.50,0.55,0.55,0.60,0.65,0.70,0.80
RL_OVERTAKING_STAGE_ITERATIONS=60,80,80,100,120,140,160,180
# Semicolons separate stages; commas separate maps within one stage. Geometry is introduced
# before speed increases so the policy does not have to learn both changes simultaneously.
RL_OVERTAKING_STAGE_MAP_GROUPS="map018;map018;map018;map018,map000;map018,map000;map018,map000;map018,map000,map015;map018,map000,map015"
# Comprehensive success naturally starts low because it includes scenarios not trained yet.
# Each gate still requires measurable cumulative progress before the next stage can begin.
RL_OVERTAKING_STAGE_MIN_SUCCESS_RATES=0.05,0.10,0.15,0.20,0.22,0.25,0.28,0.30
RL_OVERTAKING_BEST_EVAL_SCENARIO=comprehensive
RL_OVERTAKING_BASE_POLICY=profile07
RL_OVERTAKING_OPPONENT_POLICY=profile07
RL_OVERTAKING_OPPONENTS=3
# Fallback for custom curricula that omit RL_OVERTAKING_STAGE_OPPONENT_SPEED_SCALES.
RL_OVERTAKING_OPPONENT_THROTTLE_SCALE=0.90
RL_OVERTAKING_MAP_IDS=map018,map000,map015
RL_OVERTAKING_CLOSING_MAP_IDS=map018
RL_OVERTAKING_STRAIGHT_MAP_IDS=map018
RL_OVERTAKING_SINGLE_MAP_IDS=map018,map000

RL_OVERTAKING_ACTION_REPEAT=4
RL_OVERTAKING_MAX_ACTION_STEPS=450
RL_OVERTAKING_SEED=20260818
RL_WORKERS=4
RL_RAY_NUM_CPUS=0

# The 43 observations describe a narrow steering task; 96x2 learned faster than 128x3 in
# measured runs and matches the capacity already proven by the full driving policies.
RL_OVERTAKING_HIDDEN_SIZE=96
RL_OVERTAKING_HIDDEN_LAYERS=2
RL_OVERTAKING_HIDDEN_ACTIVATION=tanh
RL_OVERTAKING_TRAIN_BATCH_SIZE=4096
RL_OVERTAKING_MINIBATCH_SIZE=256
RL_OVERTAKING_LR=5e-5
RL_OVERTAKING_GAMMA=0.995
RL_OVERTAKING_ENTROPY_COEFF=0.001
RL_OVERTAKING_INITIAL_LOG_STD=-1.5
RL_OVERTAKING_NUM_EPOCHS=8
RL_OVERTAKING_GRAD_CLIP=1.0
RL_OVERTAKING_VF_CLIP_PARAM=2000.0

RL_OVERTAKING_REWARD_STEP_PENALTY=0.05
# Forward gain is rewarded only after the learner has opened a collision-safe side lane.
RL_OVERTAKING_REWARD_GAP=5.0
# Dense approach feedback: reduce imminent overlap before contact happens.
RL_OVERTAKING_REWARD_SAFETY=300.0
# Reward actual lateral separation from the leading car before contact becomes imminent.
RL_OVERTAKING_REWARD_LANE=100.0
RL_OVERTAKING_REWARD_POSITION=120.0
RL_OVERTAKING_REWARD_HOLD=2.0
RL_OVERTAKING_REWARD_SUCCESS=800.0
RL_OVERTAKING_FAILURE_PENALTY=600.0
RL_OVERTAKING_RESIDUAL_PENALTY=0.03
RL_OVERTAKING_COLLISION_PENALTY=50.0
RL_OVERTAKING_COLLISION_MAX_PENALTY=50.0
RL_OVERTAKING_OFF_ROAD_PENALTY=2.0
RL_OVERTAKING_OFF_ROAD_DISTANCE_PENALTY=1.0
RL_OVERTAKING_OFF_ROAD_MAX_PENALTY=10.0

RL_OVERTAKING_EVAL_EPISODES_PER_MAP=14
RL_OVERTAKING_MIN_SUCCESS_RATE=0.30
RL_OVERTAKING_EVAL_STEPS=450
RL_OVERTAKING_CHECKPOINT_EVERY=5
RL_BUILD_BEFORE_TRAINING=1
RL_OVERTAKING_CHECKPOINT_DIR=rl-checkpoints/overtaking-speed-curriculum
RL_OVERTAKING_OUTPUT=assets/ai/overtaking/rl_overtaking_policy.json
