# Shared recovery-policy training configuration.
# This policy is independent from profile00-profile09 and is used by every driver.

# Curriculum. Each stage uses the iteration count at the same list position.
# Explicit difficult stages prevent the final mixed stage from neglecting rare
# recovery situations.
RL_RECOVERY_STAGES=offroad_near,offroad_shallow,offroad_angled,offroad_hard,offroad_reversed,onroad_misaligned,blocked_front,nose_to_nose,map014_inflection,mixed
RL_RECOVERY_STAGE_ITERATIONS=40,40,60,120,100,100,60,120,120,100
# Intermediate gates advance the curriculum; only the final mixed gate decides
# whether the shared model is ready for the game.
RL_RECOVERY_STAGE_MIN_SUCCESS_RATES=0.98,0.98,0.98,0.98,0.90,0.90,0.98,0.98,0.98,0.99
# Dedicated stages need repeated samples of the same situation. Mixed uses two
# complete nine-scenario cycles per map to catch regressions between stages.
RL_RECOVERY_STAGE_EVAL_EPISODES_PER_MAP=5,5,5,5,8,8,5,5,64,18

# Environment and episode length.
RL_RECOVERY_ACTION_REPEAT=4
RL_RECOVERY_MAX_ACTION_STEPS=300
RL_RECOVERY_SEED=20260506
# Keep promotion reproducible while RL_RECOVERY_SEED is varied for rollout diversity.
RL_RECOVERY_EVAL_SEED=20260506
RL_WORKERS=4
RL_RAY_NUM_CPUS=0

# PPO and network. The recovery task intentionally uses a compact 96x2 model.
RL_RECOVERY_TRAIN_BATCH_SIZE=4096
RL_RECOVERY_MINIBATCH_SIZE=256
RL_RECOVERY_HIDDEN_SIZE=96
RL_RECOVERY_HIDDEN_LAYERS=2
RL_RECOVERY_HIDDEN_ACTIVATION=tanh
RL_RECOVERY_LR=2.5e-5
RL_RECOVERY_GAMMA=0.995
RL_RECOVERY_GAE_LAMBDA=0.95
RL_RECOVERY_ENTROPY_COEFF=0.0005
RL_RECOVERY_CLIP_PARAM=0.1
RL_RECOVERY_KL_COEFF=1.0
RL_RECOVERY_KL_TARGET=0.005
# Small clipped updates avoid destroying a good recovery policy in one PPO iteration.
RL_RECOVERY_NUM_EPOCHS=3
RL_RECOVERY_GRAD_CLIP=1.0
RL_RECOVERY_VF_CLIP_PARAM=100000000.0
RL_RECOVERY_VF_LOSS_COEFF=0.00005

# Recovery-specific shaping. Positive launch throttle and a stationary penalty
# prevent a zero-speed policy from steering indefinitely without moving.
RL_RECOVERY_REWARD_STEP_PENALTY=0.50
RL_RECOVERY_REWARD_STEERING_PENALTY=5.0
RL_RECOVERY_REWARD_DISTANCE=4.0
RL_RECOVERY_REWARD_ALIGNMENT=8.0
RL_RECOVERY_REWARD_TARGET_ALIGNMENT=6.0
RL_RECOVERY_REWARD_MOTION=0.75
RL_RECOVERY_REWARD_LAUNCH_THROTTLE=5.0
RL_RECOVERY_REWARD_STEERING=5.0
RL_RECOVERY_PENALTY_STATIONARY=1.0
RL_RECOVERY_REWARD_OFF_ROAD_PENALTY=0.25
RL_RECOVERY_REWARD_OFF_ROAD_DISTANCE_PENALTY=0.50
RL_RECOVERY_REWARD_OFF_ROAD_MAX_PENALTY=5.0
RL_RECOVERY_REWARD_OFF_ROAD_RECOVERY=6.0
RL_RECOVERY_REWARD_FAILURE_PENALTY=5000.0
RL_RECOVERY_REWARD_SUCCESS=3000.0

# Fallback promotion coverage for custom stage lists. The default curriculum
# uses the per-stage coverage above and a larger map014 sample.
RL_RECOVERY_EVAL_EPISODES_PER_MAP=9
RL_RECOVERY_MAP014_EVAL_EPISODES_PER_MAP=64
RL_RECOVERY_MIN_SUCCESS_RATE=1.00
RL_RECOVERY_EVAL_STEPS=300
# Evaluate regularly so a strong policy is retained even if later PPO updates regress.
RL_RECOVERY_CHECKPOINT_EVERY=10
# Recovery policies can regress abruptly between updates. Evaluate every retained
# candidate in the checkpoint window so a short-lived 100% policy is not missed.
RL_RECOVERY_EVALUATE_ALL_CANDIDATES=1
# Recovery success improved while sampled reward fluctuated, so retain the newest
# PPO state instead of preselecting a historical state by reward mean.
RL_RECOVERY_CHECKPOINT_SELECTION=latest
# Continue interrupted PPO state. RL_FORCE_FRESH_START=1 disables this resume.
RL_RECOVERY_RESUME=1

# Build and output locations. Relative paths are resolved from the repository root.
RL_BUILD_BEFORE_TRAINING=1
RL_RECOVERY_CHECKPOINT_DIR=rl-checkpoints/recovery-final-v2
RL_RECOVERY_OUTPUT=assets/ai/recovery/rl_recovery_policy.json
