gamepad.help.body=STICK SINISTRO / D-PAD: Sterza / naviga\nA / RT: Accelera / conferma\nB / LT: Frena o retromarcia / indietro\nX: Apri o chiudi le carte\nY: Telecamera TV\nLB / RB: Auto dietro / davanti\nR3: Attiva Potenziamento manuale\nSTART: Menu di pausa\nBACK: Mostra o nascondi pannelli\n\nNelle carte, seleziona Pilota o Potenziamento e premi A per cambiare AUTO / MANUALE.
