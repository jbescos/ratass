hud.info.stats.title=STATISTICHE AUTO
hud.info.stats.body=Questi numeri indicano le variazioni rispetto all'auto standard, non le capacità totali.\n\n0% indica il valore standard. +10% migliora una statistica e -10% la riduce. Una massa minore è vantaggiosa. Carte, meteo, effetti attivi e penalità aggiornano i valori.\n\nXP GIRO è il moltiplicatore applicato quando l'XP giro accumulata attraversa il traguardo.
hud.info.telemetry.title=TELEMETRIA
hud.info.telemetry.body=ORA è il segnale attuale e la barra colorata mostra lo stesso valore. PICCO e l'indicatore giallo mostrano l'ultimo picco locale, non il limite dell'auto. Un valore in crescita aggiorna subito PICCO.\n\nLa velocità è in km/h. Acceleratore, freno, sterzo e derapata mostrano l'intensità. AERO mostra la scia attuale.
hud.info.cards.title=CARTE
hud.info.cards.body=Queste sono le carte equipaggiate dall'auto osservata. Un'icona del tipo illuminata indica che la carta è attiva. I tempi mostrano la durata attiva o il recupero restante.\n\nApri le tue carte per scegliere AUTO o MANUALE sotto le carte Pilota e Potenziamento. Il pilota manuale offre il controllo completo. Il potenziamento manuale attende il tasto, il pulsante del controller o il pulsante Potenziamento sullo schermo. I rivali restano bloccati su AUTO.\n\nAVVISO mostra le penalità attuali. Tocca una carta o una riga di avviso per mettere in pausa e vedere la carta completa.
