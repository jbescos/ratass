A\ GLOWING\ UNDERBODY\ FAN\ PINS\ THE\ CAR\ DOWN\ AS\ A\ DEMANDING\ CORNER\ ARRIVES.=UN VENTILATEUR LUMINEUX PLAQUE LA VOITURE AVANT UN VIRAGE DIFFICILE.
A\ GREEN\ CATALYST\ IGNITES\ WHENEVER\ REVENGE\ ACTIVATES\ AND\ STRENGTHENS\ ITS\ REAL\ EFFECT.=UN CATALYSEUR VERT S'ALLUME À CHAQUE VENGEANCE ET RENFORCE SON EFFET RÉEL.
A\ LONG\ STRAIGHT\ AMPLIFIES\ EVERY\ ACTIVE\ POWER\ AND\ AERO\ BONUS\ OR\ PENALTY.=UNE LONGUE LIGNE DROITE AMPLIFIE TOUT BONUS OU MALUS ACTIF DE PUISSANCE ET D'AÉRO.
A\ LONG\ STRAIGHT\ AMPLIFIES\ EVERY\ ACTIVE\ POWER\ AND\ MASS\ BONUS\ OR\ PENALTY.=UNE LONGUE LIGNE DROITE AMPLIFIE TOUT BONUS OU MALUS ACTIF DE PUISSANCE ET DE MASSE.
A\ PASSIVE\ TIMING\ LINK\ STRENGTHENS\ POWERUPS\ AND\ RECHARGES\ THEM\ FASTER.=UN LIEN PASSIF RENFORCE LES BONUS ET ACCÉLÈRE LEUR RECHARGE.
A\ PASSIVE\ TIMING\ MATRIX\ STRENGTHENS\ POWERUPS\ AND\ RECHARGES\ THEM\ MUCH\ FASTER.=UNE MATRICE PASSIVE RENFORCE LES BONUS ET ACCÉLÈRE FORTEMENT LEUR RECHARGE.
A\ PASSIVE\ TIMING\ NEXUS\ DOUBLES\ POWERUP\ EFFECTS\ AND\ COOLDOWN\ RECOVERY.=UN NEXUS PASSIF DOUBLE LES EFFETS DES BONUS ET LEUR RECHARGE.
A\ QUALIFIED\ HIT\ CURSES\ ITS\ OFFENDER'S\ THROTTLE,\ FORCING\ THEM\ TO\ COMMIT\ THROUGH\ WHATEVER\ COMES\ NEXT.=MAUDIT L'ACCÉLÉRATEUR DE L'AGRESSEUR ET LE FORCE À FOND.
A\ QUALIFIED\ HIT\ MARKS\ ITS\ OFFENDER.\ AFTER\ CHARGING,\ IT\ EXCHANGES\ POSITIONS\ ONLY\ WHILE\ THEY\ ARE\ AHEAD.=MARQUE L'AGRESSEUR ET ÉCHANGE LES POSITIONS SEULEMENT S'IL EST DEVANT.
A\ QUALIFIED\ HIT\ MARKS\ ITS\ OFFENDER.\ AFTER\ CHARGING,\ THE\ HOOK\ PULLS\ THEM\ BACK\ ONLY\ WHILE\ THEY\ ARE\ AHEAD.=MARQUE L'AGRESSEUR PUIS L'ATTIRE VERS VOUS SEULEMENT S'IL EST DEVANT.
A\ QUALIFIED\ RIVAL\ HIT\ ARMS\ A\ MEDIUM-RANGE\ ENERGY\ WAVE\ THAT\ PUSHES\ NEARBY\ CARS\ AWAY.=UN CHOC ARME UNE VAGUE DE PORTÉE MOYENNE QUI REPOUSSE LES VOITURES PROCHES.
A\ QUALIFIED\ RIVAL\ HIT\ ARMS\ A\ SHORT\ PULSING\ FIELD\ THAT\ FORCES\ NEARBY\ CARS\ TOWARD\ THE\ OUTSIDE.=UN CHOC ARME UN CHAMP QUI REPOUSSE BRIÈVEMENT LES VOITURES PROCHES.
A\ QUALIFIED\ RIVAL\ HIT\ ARMS\ A\ WIDE\ HIGH-ENERGY\ FIELD\ THAT\ CLEARS\ SPACE\ FOR\ YOUR\ COMEBACK.=UN CHOC ARME UN LARGE CHAMP QUI LIBÈRE LA VOIE.
A\ RACING\ CONTROL\ MATRIX\ GREATLY\ STRENGTHENS\ THE\ EQUIPPED\ TECHNIQUE\ EFFECT.=UNE MATRICE DE COURSE RENFORCE FORTEMENT L'EFFET DE LA TECHNIQUE ÉQUIPÉE.
A\ RADICAL\ LONG-TAIL\ BODY\ MAXIMIZES\ AERO\ EFFICIENCY\ FOR\ HUGE\ STRAIGHT-LINE\ PACE\ WITH\ MODEST\ CORNERING\ SUPPORT.=UNE LONGUE CARROSSERIE MAXIMISE LA VITESSE EN LIGNE DROITE, AVEC PEU D'APPUI.
A\ REINFORCED,\ HEAVIER\ CAR\ CARRIES\ EXTRA\ POWER\ AND\ GRIP\ SO\ CONTACT\ NO\ LONGER\ RUINS\ ITS\ PACE.=UNE VOITURE RENFORCÉE GAGNE PUISSANCE ET ADHÉRENCE POUR RÉSISTER AUX CONTACTS.
A\ RIGID\ CARBON\ CELL\ CUTS\ INERTIA\ WHILE\ SHARPENING\ POWER\ DELIVERY,\ AERO\ AND\ RESPONSE.=LA CELLULE CARBONE RÉDUIT L'INERTIE ET AMÉLIORE PUISSANCE, AÉRO ET RÉPONSE.
A\ RIVAL\ HIT\ ARMS\ THE\ COUNTER\ UNTIL\ THE\ NEXT\ QUALIFIED\ HIT\ IS\ REFLECTED\ INTO\ ITS\ ATTACKER.=UN CHOC RIVAL ARME LA RIPOSTE JUSQU'À CE QUE LE PROCHAIN CHOC VALIDE SOIT RENVOYÉ SUR L'ATTAQUANT.
A\ RIVAL\ HIT\ EXECUTES\ A\ RANDOM\ TIER\ 1\ REVENGE\ CARD,\ THEN\ PREPARES\ A\ DIFFERENT\ RETALIATION.=UN CHOC EXÉCUTE UNE VENGEANCE T1 ALÉATOIRE PUIS EN PRÉPARE UNE AUTRE.
A\ RIVAL\ HIT\ EXECUTES\ A\ RANDOM\ TIER\ 2\ REVENGE\ CARD,\ THEN\ PREPARES\ A\ DIFFERENT\ RETALIATION.=UN CHOC EXÉCUTE UNE VENGEANCE T2 ALÉATOIRE PUIS EN PRÉPARE UNE AUTRE.
A\ RIVAL\ HIT\ EXECUTES\ A\ RANDOM\ TIER\ 3\ REVENGE\ CARD,\ THEN\ PREPARES\ A\ DIFFERENT\ RETALIATION.=UN CHOC EXÉCUTE UNE VENGEANCE T3 ALÉATOIRE PUIS EN PRÉPARE UNE AUTRE.
A\ RIVAL\ HIT\ MARKS\ ITS\ OFFENDER\ AND\ EMPOWERS\ YOU\ UNTIL\ AN\ AUTOMATIC\ CLOSE-RANGE\ RAM.=UN CHOC MARQUE L'AGRESSEUR ET VOUS RENFORCE JUSQU'À UNE CHARGE AUTOMATIQUE À COURTE PORTÉE.
A\ SEALED\ FLOOR\ CREATES\ EXCEPTIONAL\ CORNERING\ FORCE\ WHILE\ ADDING\ WEIGHT\ AND\ AERODYNAMIC\ RESISTANCE.=UN FOND SCELLÉ OFFRE UN APPUI EXTRÊME MAIS AJOUTE POIDS ET RÉSISTANCE.
A\ STRIPPED\ CHASSIS\ ACCELERATES\ AND\ CHANGES\ DIRECTION\ QUICKLY,\ BUT\ GIVES\ UP\ TIRE\ STABILITY.=UN CHÂSSIS ALLÉGÉ ACCÉLÈRE ET TOURNE VITE, AU PRIX DE LA STABILITÉ.
A\ STRONGER\ GREEN\ CORE\ SURGES\ WHENEVER\ REVENGE\ ACTIVATES\ AND\ MAGNIFIES\ ITS\ OUTCOME.=UN CŒUR VERT PLUS PUISSANT SURGIT À CHAQUE VENGEANCE ET AMPLIFIE SON RÉSULTAT.
A\ VISIBLE\ GROUND\ FIELD\ FORMS\ IN\ CORNERS\ OR\ CLOSE\ TRAFFIC\ FOR\ EXTREME\ STABILITY.=UN CHAMP VISIBLE APPORTE UNE STABILITÉ EXTRÊME EN VIRAGE OU TRAFIC.
A\ calibrated\ control\ unit\ strengthens\ the\ equipped\ Technique\ effect.=Une unité calibrée renforce l'effet de la Technique équipée.
A\ championship\ phase\ system\ removes\ the\ car\ from\ sight\ and\ contact\ for\ an\ extended\ attack\ window.=Un système de phase cache la voiture et bloque les contacts longtemps.
A\ glowing\ underbody\ fan\ pins\ the\ car\ down\ as\ a\ demanding\ corner\ arrives.=Un ventilateur lumineux plaque la voiture avant un virage difficile.
