hud.info.stats.title=CAR BONUSES
hud.info.stats.body=These numbers are changes from the standard car, not its total capability.\n\n0% means the standard value. +10% improves a stat and -10% reduces it. Lower mass is beneficial. Values update with cards, weather, active effects and debuffs.\n\nLAP XP is the multiplier applied when banked lap XP crosses the finish line.
hud.info.telemetry.title=TELEMETRY
hud.info.telemetry.body=NOW is the current signal and the colored bar shows the same value. PEAK and the yellow marker show the latest local peak, not the car's limit. A rising value updates PEAK immediately.\n\nSpeed is km/h. Throttle, brake, steering and drift show control or movement intensity. AERO shows the current slipstream boost.
hud.info.cards.title=CARDS
hud.info.cards.body=These are the cards equipped by the car you are watching. An illuminated type icon means that card is active. Timers show active time or cooldown remaining.\n\nOpen your cards to choose AUTO or MANUAL beneath the Driver and Powerup cards. A manual driver gives you full control. A manual powerup waits for its configured key, controller button, or the on-screen Powerup button. Rival controls are locked to AUTO.\n\nWARNING lists current debuffs. Tap a card or warning row to pause and inspect the full card.
