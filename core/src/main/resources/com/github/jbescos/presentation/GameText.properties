gamepad.help.body=LEFT STICK / D-PAD: Steer / navigate\nA / RT: Accelerate / confirm\nB / LT: Brake or reverse / back\nX: Open or close cards\nY: TV Camera\nLB / RB: Car behind / car ahead\nR3: Activate manual Powerup\nSTART: Pause menu\nBACK: Show or hide panels\n\nOn the cards screen, select Driver or Powerup and press A to toggle AUTO / MANUAL.
